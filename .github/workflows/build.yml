name: Build

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build connector
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload connector artifact
        uses: actions/upload-artifact@v4
        with:
          name: Viya.mez
          path: bin/Viya.mez
